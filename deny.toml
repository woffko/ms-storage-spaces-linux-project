# cargo-deny policy (CI: `cargo deny check`). The project is
# GPL-2.0-or-later; dependencies must be under licenses compatible with it.

[graph]
# Dependencies of the targets we build and ship (Linux); the windows-* crates
# that clap and others list for other platforms do not count.
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]

[licenses]
allow = [
    "GPL-2.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]

[advisories]
ignore = [
    # bitmaps 3.2.1 is unmaintained and `Bitmap::try_from(&[u8])` is unsound
    # (RUSTSEC-2025-0167). Only libublk (the ublk backend of spaces-cli)
    # uses it, with `Bitmap::new()` and bit operations, never `try_from`.
    # No fixed release exists; revisit when libublk moves on.
    { id = "RUSTSEC-2026-0247", reason = "unmaintained; reached only through libublk, which uses Bitmap::new() and bit operations" },
    { id = "RUSTSEC-2025-0167", reason = "unsound Bitmap::try_from(&[u8]) is never called by libublk" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
