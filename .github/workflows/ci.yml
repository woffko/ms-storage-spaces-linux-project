name: CI

on:
  push:
  pull_request:
  schedule:
    # Advisories appear after a release: look again every week.
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: No unsafe code in the project
        run: |
          missing=$(grep -L 'forbid(unsafe_code)' crates/*/src/lib.rs crates/*/src/main.rs 2>/dev/null || true)
          test -z "$missing" || { echo "no #![forbid(unsafe_code)] in: $missing"; exit 1; }
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (fixtures; the image corpus is not in the repository)
        run: cargo test --all-targets
      - name: Build without optional backends
        run: cargo build -p spaces-cli -p refs-cli --no-default-features

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Licenses, advisories, sources (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Advisories (RustSec)
        run: cargo install cargo-audit --locked && cargo audit

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo build --all-targets

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Static binary
        run: cargo build --release --target x86_64-unknown-linux-musl -p spaces-cli -p refs-cli
      - uses: actions/upload-artifact@v4
        with:
          name: spaces-x86_64-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/spaces
            target/x86_64-unknown-linux-musl/release/refs

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Format
        run: cd fuzz && cargo fmt --check
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz smoke run (30 s per target)
        run: |
          for t in $(cargo fuzz list); do
            cargo fuzz run "$t" -- -max_total_time=30 -rss_limit_mb=4096
          done
