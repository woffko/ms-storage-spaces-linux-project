[package]
name = "refs-cli"
description = "Command-line tool and FUSE driver for Microsoft ReFS volumes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["refs", "windows", "filesystem", "fuse"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "refs"
path = "src/main.rs"

[features]
default = ["fuse"]
fuse = ["dep:fuser", "dep:rustix", "dep:signal-hook"]

[dependencies]
refs.workspace = true
storage-spaces.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", optional = true }
rustix = { version = "1", features = ["fs", "mount", "process"], optional = true }
signal-hook = { version = "0.3", optional = true }
