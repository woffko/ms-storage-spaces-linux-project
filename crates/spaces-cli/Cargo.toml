[package]
name = "spaces-cli"
description = "Command-line tool for Microsoft Storage Spaces pools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["storage-spaces", "windows", "raid", "ublk", "nbd"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "spaces"
path = "src/main.rs"

[features]
default = ["ublk", "fuse"]
# The ublk backend needs libclang at build time (bindgen in libublk-rs-sys).
ublk = ["dep:libublk", "dep:signal-hook"]
fuse = ["dep:fuser"]

[dependencies]
storage-spaces.workspace = true
anyhow.workspace = true
clap.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libublk = { version = "0.4.8", optional = true }
signal-hook = { version = "0.3", optional = true }
fuser = { version = "0.18", optional = true }
