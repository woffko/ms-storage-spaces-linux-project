[package]
name = "spaces-cli"
description = "Command-line tool for Microsoft Storage Spaces pools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "spaces"
path = "src/main.rs"

[features]
default = ["ublk"]
# The ublk backend needs libclang at build time (bindgen in libublk-rs-sys).
ublk = ["dep:libublk", "dep:signal-hook"]

[dependencies]
storage-spaces.workspace = true
anyhow.workspace = true
clap.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libublk = { version = "0.4.8", optional = true }
signal-hook = { version = "0.3", optional = true }
